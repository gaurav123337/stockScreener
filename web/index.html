<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>stockScreener</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/icon.svg" alt="" class="logo" />
      <span>stockScreener</span>
    </div>
    <button id="installBtn" class="install hidden">Install</button>
  </header>

  <main id="view" class="view"><!-- tab content rendered here --></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="recommend" aria-label="Recommend">
      <span class="ic">&#128200;</span><span class="lb">Recommend</span>
    </button>
    <button class="tab" data-tab="scan" aria-label="Scan">
      <span class="ic">&#128269;</span><span class="lb">Scan</span>
    </button>
    <button class="tab" data-tab="train" aria-label="Train">
      <span class="ic">&#129504;</span><span class="lb">Train</span>
    </button>
    <button class="tab" data-tab="brokers" aria-label="Brokers">
      <span class="ic">&#128179;</span><span class="lb">Brokers</span>
    </button>
    <button class="tab" data-tab="guide" aria-label="Guide">
      <span class="ic">&#10067;</span><span class="lb">Guide</span>
    </button>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
