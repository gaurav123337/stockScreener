services:
  - type: web
    name: stockscreener-preview
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SCREENER_ENVIRONMENT
        value: production
      - key: SCREENER_FEEDBACK_EMAIL_TO
        value: garudagaura@gmail.com
      - key: SCREENER_SMTP_HOST
        value: smtp.gmail.com
      - key: SCREENER_SMTP_PORT
        value: 587
      - key: SCREENER_SMTP_USE_TLS
        value: true
      - key: SCREENER_SMTP_USERNAME
        sync: false
      - key: SCREENER_SMTP_PASSWORD
        sync: false
