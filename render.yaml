services:
  - type: web
    name: stockscreener-preview
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SCREENER_ENVIRONMENT
        value: production
      - key: SCREENER_FEEDBACK_EMAIL_TO
        value: garudagaura@gmail.com
      - key: SCREENER_FEEDBACK_EMAIL_FROM
        value: onboarding@resend.dev
      - key: RESEND_API_KEY
        sync: false
