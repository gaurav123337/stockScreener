services:
  - type: web
    name: stockscreener-preview
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SCREENER_ENVIRONMENT
        value: production
      # Set this to the already-registered, verified Product Owner email in Render.
      # Public registration intentionally always creates a normal user.
      - key: SCREENER_PRODUCT_OWNER_EMAIL
        sync: false
      # Required only when the account does not exist yet. Use 12-128 characters.
      - key: SCREENER_PRODUCT_OWNER_INITIAL_PASSWORD
        sync: false
      # Optional Indian market workspace rollout. Keep disabled until staging smoke tests pass.
      - key: SCREENER_INDIAN_API_ENABLED
        value: "false"
      - key: SCREENER_INDIAN_API_BASE_URL
        sync: false
      - key: SCREENER_INDIAN_API_KEY
        sync: false
      - key: SCREENER_INDIAN_API_AUTH_HEADER
        value: X-Api-Key
      - key: SCREENER_INDIAN_API_AUTH_SCHEME
        value: ""
